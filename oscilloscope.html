<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>示波器原理 — 电动力学仿真</title>
    <style>
        :root {
            --ahnu-blue: #003d7a;
            --ahnu-gold: #c9a227;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-sub: #718096;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            color: var(--text-main);
        }

        .header {
            background: linear-gradient(90deg, var(--ahnu-blue) 0%, #0056a3 100%);
            color: white;
            padding: 0 40px;
            display: flex;
            align-items: center;
            height: 64px;
            box-shadow: 0 4px 20px rgba(0, 61, 122, 0.25);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .header .back {
            margin-left: auto;
            color: white;
            text-decoration: none;
            font-size: 13px;
            opacity: 0.85;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header .back:hover {
            opacity: 1;
        }

        .container {
            max-width: 1200px;
            margin: 28px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
        }

        .panel {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 61, 122, 0.06);
            padding: 22px;
            height: fit-content;
        }
        .panel h2 {
            font-size: 15px;
            color: var(--ahnu-blue);
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--ahnu-gold);
        }
        .control-group {
            margin-bottom: 18px;
        }
        .control-group label {
            display: block;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 8px;
            font-weight: 600;
        }
        .control-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .control-row span {
            font-size: 12px;
            color: var(--text-sub);
            min-width: 55px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        input[type=range] {
            flex: 1;
            -webkit-appearance: none;
            height: 5px;
            border-radius: 3px;
            background: #e2e8f0;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--ahnu-blue);
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 61, 122, 0.3);
        }
        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            color: var(--text-sub);
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn:hover {
            border-color: var(--ahnu-blue);
            color: var(--ahnu-blue);
        }
        .btn.active {
            background: var(--ahnu-blue);
            color: white;
            border-color: var(--ahnu-blue);
        }
        .btn-run {
            width: 100%;
            padding: 10px;
            background: var(--ahnu-blue);
            color: white;
            border: none;
            font-size: 13px;
            border-radius: 8px;
            margin-top: 8px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-run:hover {
            background: #0056a3;
        }

        .main-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .screen-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 61, 122, 0.06);
            padding: 20px;
        }
        .screen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .screen-header h3 {
            font-size: 16px;
            color: var(--ahnu-blue);
            font-weight: 700;
        }
        .screen-header .mode-tag {
            padding: 4px 14px;
            border-radius: 20px;
            background: #e0f2fe;
            color: #075985;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .screen-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .osc-screen {
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(circle at 45% 45%, #1a2f1a 0%, #0d1a0d 60%, #050a05 100%);
            border: 4px solid #2a3a2a;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9), 0 8px 32px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }
        .osc-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background:
                linear-gradient(rgba(0, 188, 212, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 188, 212, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        .osc-screen::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.7);
            pointer-events: none;
        }
        #screenCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .wave-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .wave-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 61, 122, 0.06);
            padding: 16px;
        }
        .wave-card h4 {
            font-size: 14px;
            color: var(--text-main);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }
        .wave-card h4 .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .wave-card canvas {
            width: 100%;
            height: 140px;
            background: #0f172a;
            border-radius: 10px;
            display: block;
        }

        @media (max-width: 960px) {
            .container {
                grid-template-columns: 1fr;
            }
            .wave-row {
                grid-template-columns: 1fr;
            }
            .osc-screen {
                width: 320px;
                height: 320px;
            }
        }
        @media (max-width: 480px) {
            .osc-screen {
                width: 260px;
                height: 260px;
            }
            .header {
                padding: 0 16px;
            }
            .container {
                padding: 0 12px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>📟 示波器原理虚拟仿真实验</h1>
        <a class="back" href="index.html">← 返回实验大厅</a>
    </header>

    <div class="container">
        <aside class="panel">
            <h2>实验参数控制</h2>

            <div class="control-group">
                <label>加速电压 U₂</label>
                <div class="control-row">
                    <input type="range" id="accVoltage" min="500" max="3000" step="100" value="1500">
                    <span id="accVal">1500 V</span>
                </div>
            </div>

            <div class="control-group">
                <label>Y 偏转板直流偏置</label>
                <div class="control-row">
                    <input type="range" id="yVoltage" min="-50" max="50" step="1" value="0">
                    <span id="yVal">0 V</span>
                </div>
            </div>

            <div class="control-group">
                <label>X 偏转板直流偏置</label>
                <div class="control-row">
                    <input type="range" id="xVoltage" min="-50" max="50" step="1" value="0">
                    <span id="xVal">0 V</span>
                </div>
            </div>

            <div class="control-group">
                <label>Y 输入信号模式</label>
                <div class="btn-group">
                    <button class="btn active" data-mode="sine" onclick="setMode('y','sine',this)">正弦</button>
                    <button class="btn" data-mode="square" onclick="setMode('y','square',this)">方波</button>
                    <button class="btn" data-mode="triangle" onclick="setMode('y','triangle',this)">三角</button>
                    <button class="btn" data-mode="dc" onclick="setMode('y','dc',this)">直流</button>
                </div>
            </div>

            <div class="control-group">
                <label>X 输入信号模式</label>
                <div class="btn-group">
                    <button class="btn" data-mode="sine" onclick="setMode('x','sine',this)">正弦</button>
                    <button class="btn active" data-mode="sawtooth" onclick="setMode('x','sawtooth',this)">锯齿</button>
                    <button class="btn" data-mode="dc" onclick="setMode('x','dc',this)">直流</button>
                </div>
            </div>

            <div class="control-group">
                <label>Y 信号频率</label>
                <div class="control-row">
                    <input type="range" id="yFreq" min="0.5" max="5" step="0.1" value="1">
                    <span id="yFreqVal">1.0 Hz</span>
                </div>
            </div>

            <div class="control-group">
                <label>X 扫描频率</label>
                <div class="control-row">
                    <input type="range" id="xFreq" min="0.5" max="5" step="0.1" value="1">
                    <span id="xFreqVal">1.0 Hz</span>
                </div>
            </div>

            <div class="control-group">
                <label>Y 信号幅度</label>
                <div class="control-row">
                    <input type="range" id="yAmp" min="0" max="40" step="1" value="20">
                    <span id="yAmpVal">20 V</span>
                </div>
            </div>

            <div class="control-group">
                <label>X 信号幅度</label>
                <div class="control-row">
                    <input type="range" id="xAmp" min="0" max="40" step="1" value="20">
                    <span id="xAmpVal">20 V</span>
                </div>
            </div>

            <div class="control-group">
                <label>Y-X 相位差 Δφ</label>
                <div class="control-row">
                    <input type="range" id="phaseDiff" min="0" max="360" step="5" value="0">
                    <span id="phaseVal">0°</span>
                </div>
            </div>

            <button class="btn btn-run" id="toggleBtn" onclick="toggleSim()">⏸ 暂停仿真</button>
        </aside>

        <div class="main-area">
            <div class="screen-card">
                <div class="screen-header">
                    <h3>荧光屏显示</h3>
                    <div class="mode-tag" id="modeDisplay">Y-T 扫描模式</div>
                </div>
                <div class="screen-wrap">
                    <div class="osc-screen">
                        <canvas id="screenCanvas" width="420" height="420"></canvas>
                    </div>
                </div>
            </div>

            <div class="wave-row">
                <div class="wave-card">
                    <h4><span class="dot" style="background:#00bcd4"></span>Y 偏转板电压 Uᵧ(t)</h4>
                    <canvas id="yWaveCanvas" width="500" height="140"></canvas>
                </div>
                <div class="wave-card">
                    <h4><span class="dot" style="background:#e3b341"></span>X 偏转板电压 Uₓ(t)</h4>
                    <canvas id="xWaveCanvas" width="500" height="140"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ===================== 状态 ===================== */
        let t = 0,
            running = true;
        const params = {
            acc: 1500,
            yMode: 'sine',
            xMode: 'sawtooth',
            yFreq: 1,
            xFreq: 1,
            yAmp: 20,
            xAmp: 20,
            yDC: 0,
            xDC: 0,
            phase: 0
        };

        const SAMPLES_PER_FRAME = 8;
        const MAX_TRAIL_POINTS = 600;
        const screenTrail = [];
        let prevUx = null;

        /* ===================== DOM ===================== */
        const $ = id => document.getElementById(id);
        const scrCv = $('screenCanvas'),
            scrCtx = scrCv.getContext('2d');
        const yCv = $('yWaveCanvas'),
            yCtx = yCv.getContext('2d');
        const xCv = $('xWaveCanvas'),
            xCtx = xCv.getContext('2d');

        /* ===================== 清空余辉 ===================== */
        function clearTrail() {
            screenTrail.length = 0;
            prevUx = null;
            scrCtx.fillStyle = '#050a05';
            scrCtx.fillRect(0, 0, scrCv.width, scrCv.height);
        }

        /* ===================== 模式标签更新 ===================== */
        function updateModeTag() {
            const tag = $('modeDisplay');
            if (params.xMode === 'sawtooth') {
                tag.textContent = 'Y-T 扫描模式';
            } else if (params.xMode === 'dc' && params.yMode === 'dc') {
                tag.textContent = '直流偏转模式';
            } else {
                tag.textContent = 'X-Y 李萨如模式 (Δφ=' + params.phase + '°)';
            }
        }

        /* ===================== 重绘全部 ===================== */
        function redrawAll() {
            drawScreen();
            drawWave(yCv, yCtx, params.yMode, params.yFreq, params.yAmp, params.yDC, '#00e5ff', 'Uᵧ', params.phase);
            drawWave(xCv, xCtx, params.xMode, params.xFreq, params.xAmp, params.xDC, '#e3b341', 'Uₓ', 0);
        }

        /* ===================== 滑块事件 ===================== */
        $('accVoltage').addEventListener('input', function() {
            params.acc = parseFloat(this.value);
            $('accVal').textContent = params.acc + ' V';
            clearTrail();
            redrawAll();
        });
        $('yVoltage').addEventListener('input', function() {
            params.yDC = parseFloat(this.value);
            $('yVal').textContent = params.yDC + ' V';
            clearTrail();
            redrawAll();
        });
        $('xVoltage').addEventListener('input', function() {
            params.xDC = parseFloat(this.value);
            $('xVal').textContent = params.xDC + ' V';
            clearTrail();
            redrawAll();
        });
        $('yFreq').addEventListener('input', function() {
            params.yFreq = parseFloat(this.value);
            $('yFreqVal').textContent = params.yFreq.toFixed(1) + ' Hz';
            clearTrail();
            redrawAll();
        });
        $('xFreq').addEventListener('input', function() {
            params.xFreq = parseFloat(this.value);
            $('xFreqVal').textContent = params.xFreq.toFixed(1) + ' Hz';
            clearTrail();
            redrawAll();
        });
        $('yAmp').addEventListener('input', function() {
            params.yAmp = parseFloat(this.value);
            $('yAmpVal').textContent = params.yAmp + ' V';
            clearTrail();
            redrawAll();
        });
        $('xAmp').addEventListener('input', function() {
            params.xAmp = parseFloat(this.value);
            $('xAmpVal').textContent = params.xAmp + ' V';
            clearTrail();
            redrawAll();
        });

        /* ===== 相位差滑块：更新数值 + 清余辉 + 更新标签 + 重绘 ===== */
        $('phaseDiff').addEventListener('input', function() {
            params.phase = parseFloat(this.value);
            $('phaseVal').textContent = params.phase + '°';
            clearTrail();
            updateModeTag(); // ★ 关键修复：相位变化时刷新标签中的 Δφ 值
            redrawAll();
        });

        /* ===================== 模式切换 ===================== */
        function setMode(axis, mode, btn) {
            params[axis + 'Mode'] = mode;
            btn.parentElement.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            clearTrail();
            updateModeTag();
            redrawAll();
        }

        /* ===================== 暂停/继续 ===================== */
        function toggleSim() {
            running = !running;
            $('toggleBtn').textContent = running ? '⏸ 暂停仿真' : '▶ 继续仿真';
        }

        /* ===================== 信号生成 ===================== */
        function signal(mode, freq, amp, time, dc, phaseDeg) {
            const w = 2 * Math.PI * freq;
            const phi = (phaseDeg || 0) * Math.PI / 180;
            let s = 0;
            switch (mode) {
                case 'sine':
                    s = amp * Math.sin(w * time + phi);
                    break;
                case 'square':
                    s = amp * (Math.sin(w * time + phi) >= 0 ? 1 : -1);
                    break;
                case 'triangle':
                    s = amp * (2 / Math.PI) * Math.asin(Math.sin(w * time + phi));
                    break;
                case 'sawtooth':
                    s = amp * (2 * (((w * time + phi) / (2 * Math.PI)) % 1) - 1);
                    break;
                case 'dc':
                    s = 0;
                    break;
            }
            return s + dc;
        }

        /* ===================== 荧光屏绘制 ===================== */
        function drawScreen() {
            const W = scrCv.width,
                H = scrCv.height;
            const cx = W / 2,
                cy = H / 2;

            // 余辉淡出
            scrCtx.fillStyle = 'rgba(13, 26, 13, 0.08)';
            scrCtx.fillRect(0, 0, W, H);

            const sens = 3.5 * (1500 / params.acc);
            const dt = 0.016 / SAMPLES_PER_FRAME;

            for (let s = 0; s < SAMPLES_PER_FRAME; s++) {
                const subT = t + s * dt;
                const uy = signal(params.yMode, params.yFreq, params.yAmp, subT, params.yDC, params.phase);
                const ux = signal(params.xMode, params.xFreq, params.xAmp, subT, params.xDC, 0);

                const px = cx + ux * sens;
                const py = cy - uy * sens;

                let isBreak = false;
                if (params.xMode === 'sawtooth' && prevUx !== null) {
                    if (ux - prevUx < -params.xAmp * 0.7) {
                        isBreak = true;
                    }
                }
                prevUx = ux;

                screenTrail.push({ x: px, y: py, break: isBreak });
            }

            while (screenTrail.length > MAX_TRAIL_POINTS) {
                screenTrail.shift();
            }

            if (screenTrail.length > 1) {
                for (let i = 0; i < screenTrail.length - 1; i++) {
                    const p0 = screenTrail[i];
                    const p1 = screenTrail[i + 1];
                    if (p1.break) continue;

                    const age = i / screenTrail.length;
                    const alpha = 0.2 + age * 0.75;
                    const lw = 1.2 + age * 1.8;

                    scrCtx.strokeStyle = 'rgba(0, 230, 255, ' + alpha + ')';
                    scrCtx.lineWidth = lw;
                    scrCtx.lineCap = 'round';
                    scrCtx.lineJoin = 'round';
                    scrCtx.beginPath();
                    scrCtx.moveTo(p0.x, p0.y);
                    scrCtx.lineTo(p1.x, p1.y);
                    scrCtx.stroke();
                }
            }

            if (screenTrail.length > 0) {
                const cur = screenTrail[screenTrail.length - 1];
                scrCtx.fillStyle = '#ffffff';
                scrCtx.shadowColor = '#00e5ff';
                scrCtx.shadowBlur = 18;
                scrCtx.beginPath();
                scrCtx.arc(cur.x, cur.y, 4, 0, Math.PI * 2);
                scrCtx.fill();
                scrCtx.shadowBlur = 0;

                scrCtx.strokeStyle = 'rgba(0, 230, 255, 0.4)';
                scrCtx.lineWidth = 1.5;
                scrCtx.beginPath();
                scrCtx.arc(cur.x, cur.y, 8, 0, Math.PI * 2);
                scrCtx.stroke();
            }
        }

        /* ===================== 波形绘制 ===================== */
        function drawWave(cv, ctx, mode, freq, amp, dc, color, label, phaseDeg) {
            const W = cv.width,
                H = cv.height;
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, W, H);

            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            for (let x = 0; x < W; x += 30) { ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H);
                ctx.stroke(); }
            for (let y = 0; y < H; y += 28) { ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke(); }

            ctx.strokeStyle = 'rgba(255,255,255,0.12)';
            ctx.beginPath();
            ctx.moveTo(0, H / 2);
            ctx.lineTo(W, H / 2);
            ctx.stroke();

            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.shadowColor = color;
            ctx.shadowBlur = 6;
            ctx.beginPath();
            const dt = 0.01;
            const scaleY = (H / 2 - 10) / 55;
            for (let px = 0; px < W; px++) {
                const time = t - (W - px) * dt;
                const val = signal(mode, freq, amp, time, dc, phaseDeg);
                const py = H / 2 - val * scaleY;
                if (px === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;

            const cur = signal(mode, freq, amp, t, dc, phaseDeg);
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(W - 2, H / 2 - cur * scaleY, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = color;
            ctx.font = '12px Microsoft YaHei';
            ctx.fillText(label + ' = ' + cur.toFixed(1) + ' V', 10, 20);
        }

        /* ===================== 主循环 ===================== */
        function loop() {
            if (running) {
                t += 0.016;
                drawScreen();
                drawWave(yCv, yCtx, params.yMode, params.yFreq, params.yAmp, params.yDC, '#00e5ff', 'Uᵧ', params.phase);
                drawWave(xCv, xCtx, params.xMode, params.xFreq, params.xAmp, params.xDC, '#e3b341', 'Uₓ', 0);
            }
            requestAnimationFrame(loop);
        }

        /* ===================== 启动 ===================== */
        // 初始清屏并绘制
        clearTrail();
        updateModeTag();
        redrawAll();
        loop();
    </script>
</body>
</html>
